services:
  backend:
    build: ./backend
    image: trustrag-backend
    container_name: trustrag-backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - trustrag_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: trustrag-frontend
    container_name: trustrag-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trustrag_data: